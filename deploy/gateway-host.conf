server {
    listen 3102;
    listen [::]:3102;
    server_name _;
    client_max_body_size 100m;


    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгие ручки: crm-pull держит запрос ~минуту на полной тысяче тикетов
        # (дефолтные 60s рвали соединение — браузер видел «Service unavailable»,
        # хотя api доделывал работу в фоне). Заодно запас для SSE-стримов.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:3000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
